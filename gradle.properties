#Kotlin
kotlin.code.style=official
# La PC de desarrollo tiene ~7 GB de RAM: compilamos Kotlin dentro del proceso de Gradle
# en lugar de abrir un segundo proceso (el "daemon" de Kotlin), que reservaba otros 3 GB.
kotlin.compiler.execution.strategy=in-process

#Gradle
org.gradle.jvmargs=-Xmx2560M -XX:MaxMetaspaceSize=768M -Dfile.encoding=UTF-8
# Menos tareas en paralelo = menos memoria usada al mismo tiempo.
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
